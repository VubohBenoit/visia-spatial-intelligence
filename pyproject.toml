[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "visia-spatial-intelligence"
version = "0.1.0"
description = "Research-oriented computer vision pipeline combining object detection, depth estimation and spatial reasoning for real-time scene understanding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "VUBOH BENOIT" }]
keywords = ["computer-vision", "object-detection", "monocular-depth", "spatial-reasoning"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    # Intel macOS (x86_64) has no PyTorch wheels newer than 2.2.x; pin the
    # range that installs on the development machine.
    "torch>=2.2,<2.3",
    "transformers>=4.45,<4.50",
    # DETR's ResNet backbone is built with timm; torchvision must match torch 2.2.x.
    "timm>=1.0,<1.1",
    "torchvision>=0.17,<0.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.37"]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
visia = "visia_spatial_intelligence.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires downloaded model weights; run with `make test-integration`",
]

[tool.uv]
# Linux (CI and Docker) installs CPU-only PyTorch wheels, avoiding multi-GB CUDA downloads.
# macOS keeps using PyPI, which provides the PyTorch build for Intel and Apple Silicon.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
